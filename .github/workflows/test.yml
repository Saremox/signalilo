name: Test
on:
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  unit_test:
    name: Go vet & test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: "0"
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test -v -cover ./...
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: "0"
    - name: Build image
      run: make docker
      env:
        VERSION: test
    - name: Run image
      run: docker run --rm "ghcr.io/saremox/signalilo:$(git rev-parse HEAD)" --version
  test_go_get:
    # Only run `go get` tests on PRs with source branch in
    # github.com/saremox/signalilo, as go get will fail for PRs whose source
    # branch is in a fork.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Go install
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: go install -v github.com/saremox/signalilo@${{ github.event.pull_request.head.sha }}
      env:
        GO111MODULE: on
    - run: signalilo --version
